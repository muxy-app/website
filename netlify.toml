# Netlify build + deploy config.
# The @netlify/plugin-nextjs adapter handles SSR, ISR, image optimization,
# and route caching automatically — no extra wiring needed beyond this file.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Match the version we develop against; bump in lockstep with package.json's
  # engines if we add one. Netlify's default ships an older minor.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preview deploys for PRs are on by default; the branch-deploys / deploy-previews
# settings live in the Netlify dashboard under "Build & deploy → Branches".
[context.production]
  environment = { NODE_ENV = "production" }
